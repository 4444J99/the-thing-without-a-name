<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Danse - Join</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #0d0d0e;
      color: #f2f2f4;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    video {
      transform: scaleX(-1);
      max-width: 100%;
      max-height: 50vh;
      background: #000;
      border: 1px solid #333;
    }
    canvas {
      position: absolute;
      transform: scaleX(-1);
      pointer-events: none;
    }
    #ui {
      margin-top: 2rem;
      max-width: 600px;
    }
    button {
      background: transparent;
      color: inherit;
      border: 1px solid #555;
      padding: 0.75rem 1.5rem;
      font: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #222;
    }
    .note {
      font-size: 0.85rem;
      color: #888;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div id="container" style="position: relative; display: none;">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="ui">
    <p>Your body becomes the query.</p>
    <button id="btn-join">Join the River</button>
    <p class="note">Everything runs locally on your device. No images are recorded or sent anywhere.</p>
    <p id="status"></p>
  </div>

  <script type="module">
    const btnJoin = document.getElementById("btn-join");
    const webcam = document.getElementById("webcam");
    const overlay = document.getElementById("overlay");
    const container = document.getElementById("container");
    const status = document.getElementById("status");
    let landmarker = null;

    btnJoin.addEventListener("click", async () => {
      btnJoin.style.display = "none";
      status.innerText = "Loading pose model (client-side)...";

      try {
        // Lazy-load MediaPipe Vision from CDN (would be vendored locally for production as per plan)
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0");
        const { PoseLandmarker, FilesetResolver } = vision;

        const fileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
        );
        landmarker = await PoseLandmarker.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });

        status.innerText = "Requesting camera...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        webcam.srcObject = stream;
        container.style.display = "inline-block";

        webcam.addEventListener("loadeddata", () => {
          overlay.width = webcam.videoWidth;
          overlay.height = webcam.videoHeight;
          status.innerText = "Running... your pose now modulates the selection.";
          predictWebcam();
        });

      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    });

    let lastVideoTime = -1;
    function predictWebcam(timestamp) {
      if (!landmarker) return;
      const ctx = overlay.getContext("2d");

      let startTimeMs = timestamp || 0;
      if (lastVideoTime !== webcam.currentTime) {
        lastVideoTime = webcam.currentTime;
        const results = landmarker.detectForVideo(webcam, startTimeMs);

        ctx.clearRect(0, 0, overlay.width, overlay.height);
        if (results.landmarks && results.landmarks.length > 0) {
          // Draw skeleton for visual feedback
          ctx.fillStyle = "#fff";
          for (const lm of results.landmarks[0]) {
            ctx.beginPath();
            ctx.arc(lm.x * overlay.width, lm.y * overlay.height, 3, 0, 2 * Math.PI);
            ctx.fill();
          }

          // Emit the event that `engine.js` would listen to.
          // This maps physical posture directly to the generative query.
          const event = new CustomEvent("danse:pose_query", { detail: { landmarks: results.landmarks[0] } });
          window.dispatchEvent(event);
        }
      }
      requestAnimationFrame(predictWebcam);
    }
  </script>
</body>
</html>
