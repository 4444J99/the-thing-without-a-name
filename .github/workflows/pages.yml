name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # allow-secret: GitHub OIDC permission name, not credential material

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build allowlisted Pages artifact
        run: >-
          python3 scripts/build-pages.py
          --output "${RUNNER_TEMP}/danse-pages"
          --source-commit "${GITHUB_SHA}"
      - name: Verify public boundary and interface
        env:
          DANSE_PAGES_ARTIFACT: ${{ runner.temp }}/danse-pages
          DANSE_PAGES_SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/tests/pages-artifact.test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/danse-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
